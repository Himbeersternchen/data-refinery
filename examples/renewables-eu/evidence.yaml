# Example: which EU countries are moving fastest on renewable energy (English-language example)
# 示例：欧盟哪些国家的可再生能源转型最快（英文示例）
#
# Metrics come from Eurostat's open API: run `python -m refinery build examples/renewables-eu/evidence.yaml --live`
# to refresh evidence.metrics.json. Signals were collected by hand. `claim` is a paraphrase; where a `quote`
# is given it was checked against the Eurostat news release. Check the source before quoting anything else.
# 指标来自 Eurostat 开放接口（--live 刷新）；信号是手工整理的转述，带 quote 的几条已对照 Eurostat 新闻稿原文。

title: Which EU countries are moving fastest on renewable energy?
question: >-
  Ranks the 27 EU member states by how much their renewables share grew from 2014 to 2024 (Eurostat),
  next to what recent reports say about who is leading or lagging.
lang: en
default_sort: change_10y
trend_labels:
  up: leading
  down: lagging

metrics:
  share_2014:
    label: Share 2014
    unit: "%"
    source: eurostat-nrg-ind-ren
    show: false
    fetch:
      provider: eurostat
      dataset: nrg_ind_ren
      params: {nrg_bal: REN, unit: PC, time: "2014"}
  share_2024:
    label: Share 2024
    unit: "%"
    source: eurostat-nrg-ind-ren
    description: Share of energy from renewable sources in gross final energy consumption, 2024
    fetch:
      provider: eurostat
      dataset: nrg_ind_ren
      params: {nrg_bal: REN, unit: PC, time: "2024"}
  change_10y:
    label: Change 2014→2024
    unit: pp
    source: eurostat-nrg-ind-ren
    description: Percentage points the renewables share gained between 2014 and 2024
    derive: {op: subtract, a: share_2024, b: share_2014}

sources:
  eurostat-nrg-ind-ren:
    name: "Eurostat dataset nrg_ind_ren: share of energy from renewable sources"
    publisher: Eurostat
    url: https://ec.europa.eu/eurostat/databrowser/view/nrg_ind_ren/default/table
    tier: official
    note: CC BY 4.0
  eurostat-news-2025-12:
    name: "Eurostat news: 25.2% of energy the EU used in 2024 came from renewables"
    publisher: Eurostat
    url: https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20251218-2
    date: "2025-12-18"
    tier: official
  eurostat-news-2025-03:
    name: "Eurostat news: electricity from renewable sources reaches 47% in 2024"
    publisher: Eurostat
    url: https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20250319-1
    date: "2025-03-19"
    tier: official
  ember-eer-2026:
    name: "Ember: European Electricity Review 2026"
    publisher: Ember
    url: https://ember-energy.org/latest-insights/european-electricity-review-2026/
    date: "2026-01-22"
    tier: research
  ec-necp-be:
    name: "European Commission: assessment of Belgium's final National Energy and Climate Plan"
    publisher: European Commission
    url: https://energy.ec.europa.eu/news/commission-assessment-belgiums-national-energy-and-climate-plan-shows-increased-ambition-requires-2026-01-26_en
    date: "2026-01-26"
    tier: official
  ec-necp-ee-sk:
    name: "European Commission: assessment of Estonia's and Slovakia's final National Energy and Climate Plans"
    publisher: European Commission
    url: https://energy.ec.europa.eu/news/commissions-assessment-estonia-and-slovakia-national-energy-and-climate-plans-shows-improvements-2025-10-02_en
    date: "2025-10-02"
    tier: official

items:
