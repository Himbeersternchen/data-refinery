  - id: BE
    name: Belgium
    subtitle: België / Belgique
    keys: {eurostat: BE}
    signals:
      - {source: eurostat-news-2025-12, trend: down, claim: "Lowest renewables share of gross final energy consumption in the EU in 2024", quote: "The lowest shares of renewables were recorded in Belgium (14.3%), Luxembourg (14.7%), and Ireland (16.1%)."}
      - {source: ec-necp-be, trend: down, claim: "Commission finds Belgium's contribution to the EU 2030 renewables target lacks ambition"}
  - {id: BG, name: Bulgaria, subtitle: България, keys: {eurostat: BG}}
