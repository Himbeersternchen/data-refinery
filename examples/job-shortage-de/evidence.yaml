title: 德国哪些职业最缺人
question: 综合联邦劳动局（BA）、KOFA、Indeed、StepStone 的公开报告，德国哪些职业的人才缺口最明显？薪资水平如何？
lang: zh
default_sort: score
trend_labels:
  up: 紧缺
  down: 降温
